name: Subscription reminders

# Guaranteed daily trigger for the "renews in N days" reminder. It's a
# backstop: the reminder already fires on its own whenever the team opens
# the dashboard (the notification bell checks for it) - this just makes
# sure it also goes out for a team that doesn't log in during the window.
# All the real work (who's due, sending, once-per-period idempotency) is
# server-side and shared with the on-poll path, so the two can't
# double-send. See docs/SUBSCRIPTION_REMINDERS.md.
#
# Setup: add ONE repository secret (Settings > Secrets and variables >
# Actions > New repository secret):
#   SUBSCRIPTION_REMINDER_SECRET  - the same value set on the Railway
#                                   backend service
# The backend URL is not secret (the API is public) so it's set below,
# not as a secret. Override it with a repo VARIABLE named
# MERIDIAN_API_BASE_URL if the backend ever moves.

on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC daily; the exact time doesn't matter
  workflow_dispatch: {}    # adds a "Run workflow" button for a manual test

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the daily reminder sweep
        env:
          API_BASE: ${{ vars.MERIDIAN_API_BASE_URL || 'https://meridian-production-5e3f.up.railway.app' }}
          SECRET: ${{ secrets.SUBSCRIPTION_REMINDER_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "::error::Add the SUBSCRIPTION_REMINDER_SECRET repository secret (Settings > Secrets and variables > Actions) - same value as on the Railway backend. See docs/SUBSCRIPTION_REMINDERS.md."
            exit 1
          fi
          code=$(curl -sS -o /tmp/resp -w '%{http_code}' -X POST \
            -H "X-Reminder-Secret: $SECRET" \
            "${API_BASE%/}/notifications/reminders/run")
          echo "HTTP $code"
          cat /tmp/resp; echo
          # 200 = ok. 401 = the GitHub secret and the Railway secret don't
          # match. 503 = the backend doesn't have SUBSCRIPTION_REMINDER_SECRET
          # set. 404 = wrong URL. All are real setup bugs - fail on them.
          test "$code" = "200"
